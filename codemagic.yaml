workflows:
  ios-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web
        script: |
          npm run build

      - name: Add & Sync Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
